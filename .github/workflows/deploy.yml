name: CAP data and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether CAP data needs reprocessing
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" >/dev/null 2>&1 || true
            if ! git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
              echo "refresh=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$BEFORE_SHA" HEAD | grep -Eq '^(scripts/|public/config/|\.github/workflows/deploy\.yml)'; then
              echo "refresh=true" >> "$GITHUB_OUTPUT"
            else
              echo "refresh=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize each CAP quarter independently
        if: steps.changes.outputs.refresh == 'true'
        run: python scripts/pipeline.py
      - name: Assemble normalized periods and latest municipality signals
        if: steps.changes.outputs.refresh == 'true'
        run: python scripts/assemble.py
      - name: Validate independent period snapshots, union and censored results
        run: python scripts/validate_data.py
      - name: Install reproducible ML environment
        if: steps.changes.outputs.refresh == 'true'
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Generate exploratory anomaly model
        if: steps.changes.outputs.refresh == 'true'
        run: python scripts/ml.py
      - name: Persist all original and normalized CAP history on GitHub
        if: steps.changes.outputs.refresh == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official CAP source and analytics dataset'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Chromium for interactive UI regression checks
        run: npx playwright install --with-deps chromium
      - name: Verify city click-through, cluster selection and mobile view
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
